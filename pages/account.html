<script src="https://unpkg.com/lucide@1.72.0/dist/umd/lucide.min.js"></script>
<script>
(function(){
  const markerRe = /\[\[icon:([a-z0-9-]+)\]\]/g;
  function applyIcons(root){
    root = root || document.body;
    if(!root) return;

    root.querySelectorAll?.('[placeholder],[title],[aria-label],[alt]').forEach(el => {
      ['placeholder','title','aria-label','alt'].forEach(attr => {
        const value = el.getAttribute(attr);
        if(value && markerRe.test(value)){
          el.setAttribute(attr, value.replace(markerRe, '').replace(/\s{2,}/g, ' ').trim());
          markerRe.lastIndex = 0;
        }
      });
    });

    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        if(!markerRe.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
        markerRe.lastIndex = 0;
        const tag = node.parentElement?.tagName;
        if(['SCRIPT','STYLE','TEXTAREA','OPTION'].includes(tag)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    while(walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(node => {
      const frag = document.createDocumentFragment();
      let last = 0;
      node.nodeValue.replace(markerRe, (match, name, offset) => {
        if(offset > last) frag.append(document.createTextNode(node.nodeValue.slice(last, offset)));
        const icon = document.createElement('i');
        icon.setAttribute('data-lucide', name);
        icon.setAttribute('aria-hidden', 'true');
        icon.className = 'nansai-icon';
        frag.append(icon);
        last = offset + match.length;
      });
      if(last < node.nodeValue.length) frag.append(document.createTextNode(node.nodeValue.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });

    root.querySelectorAll?.('option').forEach(option => {
      if(markerRe.test(option.textContent)){
        option.textContent = option.textContent.replace(markerRe, '').replace(/\s{2,}/g, ' ').trim();
        markerRe.lastIndex = 0;
      }
    });

    if(window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 2.25 } });
  }

  window.nansaiApplyIcons = applyIcons;
  document.addEventListener('DOMContentLoaded', () => {
    applyIcons(document.body);
  });
})();
</script>

<script>
const API=window.API_BASE||'http://localhost:5000/api';
const getTok=()=>localStorage.getItem('nansai_token');
const aH=()=>({'Content-Type':'application/json',...(getTok()?{Authorization:'Bearer '+getTok()}:{})});
async function apiReq(m,p,b=null){
  const r=await fetch(API+p,{method:m,headers:aH(),...(b?{body:JSON.stringify(b)}:{})});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){window.NanseiAuth.logout('login.html?next=account.html');throw new Error('Please sign in again');}
  if(!r.ok)throw new Error(d.message||'Something went wrong');
  return d;
}
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupee=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2800);
}

function goPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+id));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── contact details (admin Settings, cached by site-shell) ── */
function storeContact(){
  let st={};try{st=JSON.parse(localStorage.getItem('nsh_settings')||'{}')||{};}catch{}
  const c=st.contact||{};
  return {whatsapp:String(c.whatsapp||'916382142578').replace(/\D/g,'')};
}
function helpLink(o){
  const msg='Hi Nansei Organics, I need help with my order '+o.id+'.';
  return 'https://wa.me/'+storeContact().whatsapp+'?text='+encodeURIComponent(msg);
}

/* ── who is signed in ── */
function getUser(){try{return JSON.parse(localStorage.getItem('nansai_user')||'null');}catch{return null;}}
function loadProfile(){
  const u=getUser()||{};
  const first=u.firstName||(u.name||'').split(' ')[0]||'';
  const lead=document.getElementById('acctLead');
  if(lead&&first)lead.textContent='Hello '+first+'. Every order you place with this account, ready to track.';
  const adminBtn=document.getElementById('adminPanelBtn');
  if(adminBtn)adminBtn.classList.toggle('hidden',u.role!=='admin');
}

/* ── orders (GET /orders/my-orders only ever returns the signed-in customer's own orders) ── */
let ORDERS=[];
const STATUS={
  pending:   {label:'Order placed', badge:'bg-amber-50 text-amber-800 border border-amber-200', dot:'bg-amber-500', step:1},
  processing:{label:'Confirmed',    badge:'bg-amber-50 text-amber-800 border border-amber-200', dot:'bg-amber-500', step:2},
  packed:    {label:'Packed',       badge:'bg-amber-50 text-amber-800 border border-amber-200', dot:'bg-amber-500', step:3},
  shipped:   {label:'Shipped',      badge:'bg-forest-pale text-forest-mid border border-forest-light/30', dot:'bg-forest-light', step:4},
  delivered: {label:'Delivered',    badge:'bg-green-50 text-green-800 border border-green-200', dot:'bg-green-700', step:5},
  cancelled: {label:'Cancelled',    badge:'bg-red-50 text-red-700 border border-red-200', dot:'bg-red-500', step:0},
  refunded:  {label:'Refunded',     badge:'bg-red-50 text-red-700 border border-red-200', dot:'bg-red-500', step:0},
};
const TSTEPS=['Placed','Confirmed','Packed','Shipped','Delivered'];
const statusKey=s=>{const k=String(s||'pending').toLowerCase();return STATUS[k]?k:'pending';};
const tabOf=k=>['pending','processing','packed'].includes(k)?'processing':(k==='refunded'?'cancelled':k);
function fmtDate(d){return d?new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';}
function imgOf(it){
  const im=it.product&&it.product.images&&it.product.images[0];
  const u=(im&&(im.url||im))||it.image||'';
  return /^https?:\/\//.test(u)?(window.ikThumb?ikThumb(u,140):u):'images/photo-coming-soon.svg';
}
function productIdOf(it){const p=it.product;return p&&typeof p==='object'?(p._id||''):(p||'');}

async function loadOrders(){
  const wrap=document.getElementById('ordersContainer');
  if(wrap)wrap.innerHTML='<div class="py-14 text-center text-[0.84rem] text-text-light">Loading your orders…</div>';
  try{
    const res=await apiReq('GET','/orders/my-orders');
    const me=(getUser()||{});
    const myId=String(me._id||me.id||'');
    ORDERS=(res.data||res.orders||[])
      .filter(o=>!o.user||!myId||String(o.user._id||o.user)===myId)   /* belt and braces: never show someone else's order */
      .map(o=>{
        const a=o.shippingAddress||{};
        return {
          id:o.orderNumber||o._id,_id:o._id,raw:o,
          placed:fmtDate(o.createdAt),delivered:fmtDate(o.deliveredAt),
          key:statusKey(o.orderStatus),
          items:(o.items||[]).map(it=>({name:it.name||(it.product&&it.product.name)||'Product',qty:it.quantity||1,price:Number(it.price)||0,size:it.selectedQuantity||'',img:imgOf(it),pid:productIdOf(it)})),
          total:o.totalPrice,addr:a,
          tracking:o.trackingNumber||'',courier:o.courierService||'',
          trackUrl:/^https:\/\//.test(o.trackingUrl||'')?o.trackingUrl:'',
          eta:o.estimatedDelivery?fmtDate(o.estimatedDelivery):'',
        };
      });
  }catch(err){
    ORDERS=[];
    if(wrap)wrap.innerHTML='<div class="py-14 text-center"><p class="text-[0.86rem] text-text-mid font-semibold mb-2">We could not load your orders.</p><button class="text-forest-light text-[0.8rem] font-bold underline bg-transparent border-0 cursor-pointer" onclick="loadOrders()">Try again</button></div>';
    const c=document.getElementById('ordersCount');if(c)c.textContent=err.message;
    return;
  }
  const c=document.getElementById('ordersCount');
  if(c)c.textContent=ORDERS.length?ORDERS.length+' order'+(ORDERS.length!==1?'s':'')+' placed with this account':'No orders yet';
  renderOrders(curTab);
}

function trackHTML(step){
  return '<div class="flex items-start overflow-x-auto pb-1 my-4 no-scrollbar">'+TSTEPS.map((s,i)=>{
    const done=i<step,active=i===step-1;
    return '<div class="flex flex-col items-center flex-1 min-w-[60px] relative">'
      +'<div class="track-line'+(i<step-1?' done':'')+'"></div>'
      +'<div class="relative z-10 w-6 h-6 rounded-full flex items-center justify-center text-[0.58rem] font-black flex-shrink-0 '+(done?'bg-forest-light border-2 border-forest-light text-white':'bg-white border-2 border-forest-dark/15 text-transparent')+(active?' shadow-[0_0_0_4px_rgba(74,140,92,.18)]':'')+'">✓</div>'
      +'<div class="text-[0.6rem] mt-1.5 text-center leading-tight '+(active?'text-forest-dark font-black':done?'text-text-mid font-bold':'text-text-light font-semibold')+'">'+s+'</div>'
      +'</div>';
  }).join('')+'</div>';
}

const BTN='px-[0.85rem] py-[0.36rem] text-[0.74rem] font-bold bg-white text-text-mid border-[1.5px] border-forest-dark/20 rounded-nansai-sm cursor-pointer no-underline inline-flex items-center hover:border-forest-light hover:text-forest-dark transition-all';
function orderCardHTML(o,detail){
  const s=STATUS[o.key];
  const canCancel=['pending','processing','packed'].includes(o.key);
  const items=o.items.map(it=>`
    <div class="flex gap-[0.85rem] items-start py-[0.65rem] border-b border-forest-dark/[0.06] last:border-b-0">
      <img src="${esc(it.img)}" class="w-[62px] h-[62px] object-cover flex-shrink-0 border border-forest-dark/10 rounded-nansai-sm bg-cream" loading="lazy" alt=""/>
      <div class="flex-1 min-w-0">
        <div class="text-[0.84rem] font-semibold text-text-dark mb-0.5 leading-snug">${esc(it.name)}</div>
        <div class="text-[0.72rem] text-text-light">${it.size?esc(it.size)+' &nbsp;·&nbsp; ':''}Qty ${esc(it.qty)} &nbsp;·&nbsp; ${rupee(it.price)} each</div>
        ${it.pid?`<div class="flex gap-1.5 flex-wrap mt-2">
          <a class="${BTN}" href="product.html?id=${encodeURIComponent(it.pid)}">Buy it again</a>
          ${o.key==='delivered'?`<a class="${BTN}" href="product.html?id=${encodeURIComponent(it.pid)}#reviews">Write a review</a>`:''}
        </div>`:''}
      </div>
    </div>`).join('');
  let note='';
  if(o.key==='shipped')note=(o.courier?esc(o.courier)+' · ':'')+(o.tracking?'AWB <strong class="text-forest-dark">'+esc(o.tracking)+'</strong>':'On its way')+(o.eta?' · expected '+esc(o.eta):'');
  else if(o.key==='delivered')note='Delivered on '+esc(o.delivered);
  else if(canCancel)note='We will share the tracking number once it is dispatched';
  return `<div class="border border-forest-dark/[0.09] rounded-nansai overflow-hidden mb-[0.9rem] bg-white shadow-nansai">
    <div class="bg-cream/60 px-4 py-[0.7rem] flex flex-wrap gap-[0.6rem_1.4rem] border-b border-forest-dark/[0.07] items-center">
      <div class="flex flex-col gap-px"><span class="text-[0.58rem] font-black uppercase tracking-[0.1em] text-text-light">Order placed</span><span class="text-[0.8rem] font-bold text-text-dark">${esc(o.placed)}</span></div>
      <div class="flex flex-col gap-px"><span class="text-[0.58rem] font-black uppercase tracking-[0.1em] text-text-light">Total</span><span class="text-[0.8rem] font-bold text-text-dark">${rupee(o.total)}</span></div>
      <div class="flex flex-col gap-px"><span class="text-[0.58rem] font-black uppercase tracking-[0.1em] text-text-light">Ship to</span><span class="text-[0.8rem] font-bold text-text-dark">${esc(o.addr.fullName||'—')}</span></div>
      <div class="flex flex-col gap-px ml-auto text-right"><span class="text-[0.58rem] font-black uppercase tracking-[0.1em] text-text-light">Order #</span><span class="text-[0.78rem] font-bold text-forest-light">${esc(o.id)}</span></div>
    </div>
    <div class="px-4 py-[0.9rem]">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="inline-flex items-center gap-1.5 text-[0.7rem] font-bold px-[10px] py-[3px] rounded-full ${s.badge}"><span class="w-[6px] h-[6px] rounded-full ${s.dot} inline-block"></span>${s.label}</span>
          ${note?`<span class="text-[0.73rem] text-text-light">${note}</span>`:''}
        </div>
        ${detail?'':`<button class="${BTN}" onclick="openDetail('${esc(o._id)}')">Order details</button>`}
      </div>
      ${s.step?trackHTML(s.step):''}
      ${items}
    </div>
    <div class="border-t border-forest-dark/[0.07] px-4 py-[0.65rem] flex gap-[0.4rem] flex-wrap bg-cream/35">
      ${['cancelled','refunded'].includes(o.key)?'':`<a class="${BTN} !bg-forest-dark !text-white !border-forest-dark" href="track-order.html?order=${encodeURIComponent(o.id)}">Track order</a>`}
      ${canCancel?`<button class="${BTN} !text-red-700 hover:!border-red-400" onclick="cancelOrder('${esc(o._id)}')">Cancel order</button>`:''}
      <button class="${BTN}" onclick="printOrder('${esc(o._id)}')">Print summary</button>
      <a class="${BTN}" href="${helpLink(o)}" target="_blank" rel="noopener">${o.key==='delivered'?'Return or problem? Chat with us':'Get help'}</a>
    </div>
  </div>`;
}

let curTab='all';
function renderOrders(f){
  curTab=f||'all';
  const q=(document.getElementById('orderSearch')?.value||'').trim().toLowerCase();
  let list=curTab==='all'?ORDERS:ORDERS.filter(o=>tabOf(o.key)===curTab);
  if(q)list=list.filter(o=>String(o.id).toLowerCase().includes(q)||o.items.some(i=>i.name.toLowerCase().includes(q)));
  const wrap=document.getElementById('ordersContainer');if(!wrap)return;
  if(list.length){wrap.innerHTML=list.map(o=>orderCardHTML(o)).join('');return;}
  wrap.innerHTML=ORDERS.length
    ?'<div class="text-center py-14 px-4 text-[0.86rem] text-text-light font-semibold">No orders match this filter.</div>'
    :'<div class="text-center py-16 px-4 bg-white border border-forest-dark/[0.09] rounded-nansai"><p class="font-serif text-[1.4rem] font-bold text-forest-dark mb-1">You have not ordered yet</p><p class="text-text-light text-[0.84rem] mb-4">Your orders will show up here as soon as you place one.</p><a href="index.html#products" class="inline-flex px-5 py-2.5 bg-forest-dark text-white text-[0.8rem] font-bold rounded-nansai-sm no-underline hover:bg-forest-mid">Shop the harvest</a></div>';
}
function filterOrders(){renderOrders(curTab);}
function setOrderTab(f,btn){
  document.querySelectorAll('.ftab').forEach(t=>{
    t.classList.remove('active','text-forest-dark','border-b-forest-light','font-bold');
    t.classList.add('text-text-light','border-b-transparent');
  });
  if(btn){btn.classList.add('active','text-forest-dark','border-b-forest-light','font-bold');btn.classList.remove('text-text-light','border-b-transparent');}
  renderOrders(f);
}
function addrLines(a){return [a.fullName,a.addressLine1,a.addressLine2,[a.city,a.state].filter(Boolean).join(', ')+(a.pincode?' – '+a.pincode:''),a.phone?'Phone '+a.phone:''].filter(Boolean);}
function summaryRows(r){
  const n=v=>Number(v)||0;
  const rows=[['Items',n(r.itemsPrice)],['Delivery',n(r.shippingPrice)]];
  if(n(r.taxPrice))rows.push(['GST',n(r.taxPrice)]);
  if(n(r.codFee))rows.push(['Cash on delivery fee',n(r.codFee)]);
  if(n(r.discount))rows.push(['Discount'+(r.couponCode?' ('+r.couponCode+')':''),-n(r.discount)]);
  return rows;
}
function openDetail(id){
  const o=ORDERS.find(x=>x._id===id);if(!o)return;
  const r=o.raw;
  document.getElementById('detailId').textContent=o.id;
  document.getElementById('orderDetailBody').innerHTML=`
    <h1 class="font-serif text-[1.7rem] font-bold text-forest-dark mb-[1.1rem]">Order ${esc(o.id)}</h1>
    ${orderCardHTML(o,true)}
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-[0.85rem] mt-4">
      <div class="bg-white border border-forest-dark/[0.09] rounded-nansai overflow-hidden shadow-nansai">
        <div class="px-[1.15rem] py-[0.8rem] border-b border-forest-dark/[0.07] bg-cream/50"><h2 class="font-serif text-[1.1rem] font-bold text-forest-dark">Delivery address</h2></div>
        <div class="px-4 py-[0.9rem] text-[0.81rem] text-text-dark leading-[1.75]">${addrLines(o.addr).map(esc).join('<br/>')}</div>
      </div>
      <div class="bg-white border border-forest-dark/[0.09] rounded-nansai overflow-hidden shadow-nansai">
        <div class="px-[1.15rem] py-[0.8rem] border-b border-forest-dark/[0.07] bg-cream/50"><h2 class="font-serif text-[1.1rem] font-bold text-forest-dark">Payment</h2></div>
        <div class="px-4 py-[0.9rem]">
          ${summaryRows(r).map(([k,v])=>`<div class="flex justify-between text-[0.8rem] text-text-dark py-[0.28rem] border-b border-forest-dark/[0.06]"><span>${esc(k)}</span><span>${v===0&&k==='Delivery'?'<b class="text-green-700">Free</b>':(v<0?'− '+rupee(-v):rupee(v))}</span></div>`).join('')}
          <div class="flex justify-between text-[0.92rem] font-black text-forest-dark py-[0.4rem] mt-0.5"><span>Order total</span><span>${rupee(r.totalPrice)}</span></div>
          <div class="text-[0.72rem] text-text-light">${esc(r.paymentMethod==='COD'?'Cash on delivery':'Paid online ('+(r.paymentMethod||'')+')')}${r.isPaid?' · paid':''}</div>
        </div>
      </div>
    </div>`;
  goPage('order-detail');
}
async function cancelOrder(id){
  const o=ORDERS.find(x=>x._id===id);if(!o)return;
  if(!confirm('Cancel order '+o.id+'? This cannot be undone.'))return;
  try{
    await apiReq('PUT','/orders/'+encodeURIComponent(id)+'/cancel',{reason:'Cancelled by customer from My Account'});
    showToast('Order '+o.id+' is cancelled'+(o.raw.isPaid?'. Your refund will be processed to the original payment method.':''));
    await loadOrders();
    if(document.getElementById('page-order-detail').classList.contains('active'))openDetail(id);
  }catch(err){showToast(err.message);}
}
function printOrder(id){
  const o=ORDERS.find(x=>x._id===id);if(!o)return;
  const r=o.raw,w=window.open('','_blank','width=760,height=900');
  if(!w){showToast('Allow pop-ups to print the order summary');return;}
  const rows=o.items.map(it=>`<tr><td>${esc(it.name)}${it.size?' <small>('+esc(it.size)+')</small>':''}</td><td class="n">${esc(it.qty)}</td><td class="n">${rupee(it.price)}</td><td class="n">${rupee(it.price*it.qty)}</td></tr>`).join('');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Order ${esc(o.id)} — Nansei Organics</title>
  <style>body{font-family:Inter,Arial,sans-serif;color:#1a2416;margin:40px;font-size:13px}h1{font-family:'Cormorant Garamond',Georgia,serif;color:#0f2218;margin:0 0 4px;font-size:26px}
  .muted{color:#7a9980}table{width:100%;border-collapse:collapse;margin:22px 0}th,td{padding:8px 6px;border-bottom:1px solid #e6e1d6;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#3d5a45}.n{text-align:right}
  .tot td{border:0;padding:4px 6px}.grand td{font-weight:800;font-size:15px;border-top:2px solid #0f2218}.head{display:flex;justify-content:space-between;border-bottom:3px solid #c9a84c;padding-bottom:14px}</style></head><body>
  <div class="head"><div><h1>Nansei Organics</h1><div class="muted">Order summary (not a tax invoice)</div></div><div style="text-align:right"><b>Order ${esc(o.id)}</b><br>${esc(o.placed)}</div></div>
  <p><b>Ship to</b><br>${addrLines(o.addr).map(esc).join('<br>')}</p>
  <table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr></thead><tbody>${rows}</tbody></table>
  <table class="tot">${summaryRows(r).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v<0?'− '+rupee(-v):rupee(v)}</td></tr>`).join('')}<tr class="grand"><td>Total</td><td class="n">${rupee(r.totalPrice)}</td></tr></table>
  <p class="muted">Payment: ${esc(r.paymentMethod==='COD'?'Cash on delivery':r.paymentMethod||'')} · Status: ${esc(STATUS[o.key].label)}</p>
  <script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}

function logout(){showToast('Signed out');setTimeout(()=>window.NanseiAuth.logout('login.html'),500);}

// Sign-in guard: this page only ever shows the signed-in customer's own orders
if(window.NanseiAuth.requireAuth('login.html?next=account.html')!==false){
  loadProfile();
  loadOrders();
  if(location.search||location.hash)history.replaceState(null,'',location.pathname);
}
</script>
