<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — Nansai Organics</title>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--white:#fff;--off-white:#f8f6f2;--stone:#e8e4dc;--stone-2:#d4cfc6;--text:#1a1a1a;--muted:#888880;--green:#1e3d2f;--gold:#b8922a;--error:#c0392b}
html,body{margin:0;padding:0;width:100%}
body{font-family:'Inter',sans-serif;background:var(--off-white);color:var(--text);-webkit-font-smoothing:antialiased;}

/* Mobile first: simple block layout, no flex clipping */
.page-center{width:100%;padding:40px 20px;}
.form-wrap{width:100%;max-width:380px;margin:0 auto;background:var(--white);padding:40px 36px;border:1px solid var(--stone);}

/* Desktop: vertically center */
@media(min-width:481px){
  .page-center{min-height:100vh;display:flex;align-items:center;justify-content:center;}
}

.pg{display:none}.pg.on{display:block}
.logo{text-align:center;margin-bottom:32px}
.logo img{height:56px;width:auto;margin:0 auto;display:block}
.form-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;letter-spacing:-.01em;line-height:1.1;margin-bottom:6px}
.form-sub{font-size:.78rem;font-weight:300;color:var(--muted);letter-spacing:.02em;margin-bottom:32px}
.field{margin-bottom:20px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.field label{display:block;font-size:.63rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.forgot{font-size:.68rem;color:var(--muted);border:none;border-bottom:1px solid transparent;background:none;cursor:pointer;font-family:'Inter',sans-serif;padding:0;letter-spacing:.04em;transition:color .2s,border-color .2s}
.forgot:hover{color:var(--text);border-bottom-color:var(--text)}
.inp-wrap{position:relative}
input{width:100%;padding:13px 0;border:none;border-bottom:1px solid var(--stone-2);background:transparent;font-family:'Inter',sans-serif;font-size:16px;font-weight:300;color:var(--text);outline:none;transition:border-color .25s;letter-spacing:.02em;-webkit-appearance:none;border-radius:0;}
input::placeholder{color:var(--stone-2)}
input:focus{border-color:var(--text)}
input.err{border-color:var(--error)}
.inp-line{position:absolute;bottom:0;left:0;height:1px;width:0;background:var(--text);transition:width .3s cubic-bezier(.4,0,.2,1)}
input:focus~.inp-line{width:100%}
.eye-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--stone-2);display:flex;align-items:center;transition:color .2s;padding:10px 4px;}
.eye-btn:hover{color:var(--text)}
.err-msg{font-size:.68rem;color:var(--error);margin-top:6px;letter-spacing:.02em;display:none}
.err-msg.on{display:block}
.strength-row{display:flex;gap:4px;margin-top:10px;height:2px}
.strength-row span{flex:1;background:var(--stone);transition:background .3s;border-radius:2px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:17px 16px;
  background:var(--black);color:var(--white);
  border:none;border-radius:0;
  font-family:'Inter',sans-serif;font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;margin-top:28px;
  -webkit-appearance:none;
  transition:background .2s;
  min-height:54px;
}
.btn:hover{background:var(--green)}
.btn:active{opacity:.85}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{margin-top:24px;padding-top:20px;border-top:1px solid var(--stone);font-size:.72rem;font-weight:300;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.switch button{background:none;border:none;border-bottom:1px solid var(--text);font-family:'Inter',sans-serif;font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text);cursor:pointer;padding-bottom:1px;transition:color .2s,border-color .2s}
.switch button:hover{color:var(--green);border-color:var(--green)}
.back-btn{background:none;border:none;font-family:'Inter',sans-serif;font-size:.68rem;font-weight:400;color:var(--muted);cursor:pointer;letter-spacing:.06em;display:flex;align-items:center;gap:6px;margin-bottom:24px;padding:0;transition:color .2s}
.back-btn:hover{color:var(--text)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--stone-2);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--stone)}
.g-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:15px 16px;
  background:var(--white);color:var(--text);
  border:1px solid var(--stone-2);border-radius:0;
  font-family:'Inter',sans-serif;font-size:.78rem;font-weight:400;letter-spacing:.04em;
  cursor:pointer;
  -webkit-appearance:none;
  transition:border-color .2s,background .2s;
  min-height:52px;
}
.g-btn:hover{border-color:var(--text);background:#fafafa}
.g-btn svg{flex-shrink:0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--black);color:var(--white);font-size:.72rem;font-weight:400;letter-spacing:.08em;padding:12px 24px;white-space:nowrap;opacity:0;pointer-events:none;z-index:9999;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--error)}

@media(max-width:480px){
  .page-center{padding:0;}
  .form-wrap{padding:36px 20px 72px;border:none;min-height:100vh;}
  .form-title{font-size:1.75rem}
}
</style>
</head>
<body>
<div class="page-center">
<div class="form-wrap">
  <div class="logo">
    <img src="nansei_org_logo.svg" alt="Nansai Organics" onerror="this.src='nansei organics.png'"/>
  </div>

  <!-- LOGIN -->
  <div id="pg-login" class="pg on">
    <h2 class="form-title">Sign in</h2>
    <p class="form-sub">Welcome back</p>
    <form onsubmit="doLogin(event)" novalidate>
      <div class="field">
        <label>Email</label>
        <div class="inp-wrap">
          <input id="l-email" type="email" placeholder="your@email.com" autocomplete="email" inputmode="email"/>
          <div class="inp-line"></div>
        </div>
        <p class="err-msg" id="l-email-err"></p>
      </div>
      <div class="field">
        <div class="field-top">
          <label>Password</label>
          <button type="button" class="forgot" onclick="show('forgot')">Forgot password?</button>
        </div>
        <div class="inp-wrap">
          <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:36px"/>
          <div class="inp-line"></div>
          <button type="button" class="eye-btn" onclick="toggleEye('l-pass',this)">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="err-msg" id="l-pass-err"></p>
      </div>
      <button class="btn" id="btn-login" type="submit">
        Continue
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <div class="divider">or</div>
    <button class="g-btn" onclick="googleSignIn()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="switch">New here? <button onclick="show('register')">Create account</button></div>
  </div>

  <!-- REGISTER -->
  <div id="pg-register" class="pg">
    <h2 class="form-title">Create account</h2>
    <p class="form-sub">Join Nansai Organics</p>
    <form onsubmit="doRegister(event)" novalidate>
      <div class="field">
        <label>Full name</label>
        <div class="inp-wrap">
          <input id="r-name" type="text" placeholder="Arjun Mehta" autocomplete="name"/>
          <div class="inp-line"></div>
        </div>
        <p class="err-msg" id="r-name-err"></p>
      </div>
      <div class="field">
        <label>Email</label>
        <div class="inp-wrap">
          <input id="r-email" type="email" placeholder="your@email.com" autocomplete="email" inputmode="email"/>
          <div class="inp-line"></div>
        </div>
        <p class="err-msg" id="r-email-err"></p>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="inp-wrap">
          <input id="r-pass" type="password" placeholder="Min. 8 characters" autocomplete="new-password" style="padding-right:36px" oninput="strength(this.value)"/>
          <div class="inp-line"></div>
          <button type="button" class="eye-btn" onclick="toggleEye('r-pass',this)">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-row"><span id="s1"></span><span id="s2"></span><span id="s3"></span></div>
        <p class="err-msg" id="r-pass-err"></p>
      </div>
      <button class="btn" id="btn-reg" type="submit">
        Create Account
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <div class="divider">or</div>
    <button class="g-btn" onclick="googleSignIn()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="switch">Have an account? <button onclick="show('login')">Sign in</button></div>
  </div>

  <!-- FORGOT PASSWORD -->
  <div id="pg-forgot" class="pg">
    <button class="back-btn" onclick="show('login')">
      <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to sign in
    </button>
    <h2 class="form-title">Reset password</h2>
    <p class="form-sub">We'll send a reset link to your email</p>
    <form onsubmit="doForgot(event)" novalidate>
      <div class="field">
        <label>Email</label>
        <div class="inp-wrap">
          <input id="f-email" type="email" placeholder="your@email.com" autocomplete="email" inputmode="email"/>
          <div class="inp-line"></div>
        </div>
        <p class="err-msg" id="f-email-err"></p>
      </div>
      <button class="btn" id="btn-forgot" type="submit">Send Reset Link</button>
    </form>
  </div>

</div>
</div>
<div id="toast"></div>

<script>
const API = window.API_BASE || 'http://localhost:5000/api';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

async function apiFetch(url, options = {}) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch(url, { ...options, signal: ctrl.signal });
    clearTimeout(tid);
    return r;
  } catch(err) {
    clearTimeout(tid);
    if (err.name === 'AbortError') throw new Error('Request timed out. Check your connection.');
    throw new Error('Network error. Check your connection.');
  }
}

async function apiFetch(url, options = {}) {
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), 12000); // 12s timeout
  try {
    const r = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(tid);
    return r;
  } catch(err) {
    clearTimeout(tid);
    if (err.name === 'AbortError') throw new Error('Request timed out. Check your connection.');
    throw new Error('Network error. Check your connection.');
  }
}

function show(pg) {
  ['login','register','forgot'].forEach(p =>
    document.getElementById('pg-'+p).classList.toggle('on', p === pg)
  );
  clearErr();
  window.scrollTo(0,0);
}

function toggleEye(id, btn) {
  const inp = document.getElementById(id);
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  btn.innerHTML = isPass
    ? `<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
    : `<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
}

function strength(v) {
  const s = !v ? 0 : v.length < 6 ? 1 : v.length < 10 ? 2 : 3;
  const c = ['','#c0392b','#b8922a','#1e3d2f'];
  [1,2,3].forEach(i => document.getElementById('s'+i).style.background = s >= i ? c[s] : 'var(--stone)');
}

function setErr(id, msg) {
  const el = document.getElementById(id); if (el) el.classList.add('err');
  const em = document.getElementById(id+'-err'); if (em) { em.textContent = msg; em.classList.add('on'); }
}

function clearErr() {
  document.querySelectorAll('input').forEach(i => i.classList.remove('err'));
  document.querySelectorAll('.err-msg').forEach(e => { e.classList.remove('on'); e.textContent = ''; });
}

let _tt;
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'on' + (type ? ' '+type : '');
  clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('on'), 3000);
}

function setLoad(id, on) {
  const b = document.getElementById(id);
  b.disabled = on;
  if (on) { b.dataset.h = b.innerHTML; b.innerHTML = `<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" stroke-opacity=".2"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`; }
  else b.innerHTML = b.dataset.h;
}

async function doLogin(e) {
  e.preventDefault(); clearErr();
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  let ok = true;
  if (!email)                     { setErr('l-email','Email is required'); ok=false; }
  else if (!EMAIL_RE.test(email)) { setErr('l-email','Invalid email address'); ok=false; }
  if (!pass)                      { setErr('l-pass','Password is required'); ok=false; }
  if (!ok) return;
  setLoad('btn-login', true);
  try {
    const r = await apiFetch(API+'/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password:pass}) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Invalid credentials');
    save(d);
  } catch(err) { toast(err.message, 'err'); setLoad('btn-login', false); }
}

async function doRegister(e) {
  e.preventDefault(); clearErr();
  const name  = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass  = document.getElementById('r-pass').value;
  let ok = true;
  if (!name)                      { setErr('r-name','Name is required'); ok=false; }
  if (!email)                     { setErr('r-email','Email is required'); ok=false; }
  else if (!EMAIL_RE.test(email)) { setErr('r-email','Invalid email address'); ok=false; }
  if (!pass)                      { setErr('r-pass','Password is required'); ok=false; }
  else if (pass.length < 6)       { setErr('r-pass','Minimum 6 characters'); ok=false; }
  if (!ok) return;
  setLoad('btn-reg', true);
  try {
    const r = await apiFetch(API+'/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, email, password:pass}) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Registration failed');
    save(d);
  } catch(err) { toast(err.message, 'err'); setLoad('btn-reg', false); }
}

async function doForgot(e) {
  e.preventDefault(); clearErr();
  const email = document.getElementById('f-email').value.trim();
  if (!email)                     { setErr('f-email','Email is required'); return; }
  if (!EMAIL_RE.test(email))      { setErr('f-email','Invalid email address'); return; }
  setLoad('btn-forgot', true);
  try {
    const r = await apiFetch(API+'/auth/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Something went wrong');
    toast('Reset link sent! Check your inbox.', 'ok');
    setTimeout(() => show('login'), 2500);
  } catch(err) { toast(err.message, 'err'); }
  finally { setLoad('btn-forgot', false); }
}

function save(d) {
  // 1. Set token FIRST so clearSession doesn't break the fetch
  localStorage.setItem('nansai_token', d.token);
  localStorage.setItem('nansai_user', JSON.stringify(d.user));
  if (d.user?.role === 'admin') {
    localStorage.setItem('admin_token', d.token);
    localStorage.setItem('admin_user', JSON.stringify({name:d.user.name, email:d.user.email}));
  }

  // 2. Clear only previous session keys (not cart/wishlist, not the token we just set)
  sessionStorage.clear();
  ['checkoutDraft','checkoutAddress','checkoutPayment','mkOrders','selectedProduct',
   'ordersCache','profileCache','addressesCache','nansai_activity',
   'recommendations','coupons','rewardPoints','searchHistory','recentlyViewed'].forEach(k => localStorage.removeItem(k));

  // 3. Restore this user's cart + wishlist from DB
  const api = window.API_BASE || 'http://localhost:5000/api';
  const headers = { 'Content-Type':'application/json', Authorization:'Bearer '+d.token };

  Promise.all([
    fetch(api+'/cart',     { headers, cache:'no-store' }).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(api+'/wishlist', { headers, cache:'no-store' }).then(r=>r.ok?r.json():null).catch(()=>null),
  ]).then(([cartRes, wishRes]) => {
    if (cartRes?.data?.items) {
      const items = cartRes.data.items.map(i => ({
        id: i.product?._id||i.product, name: i.product?.name||'',
        price: i.product?.price||0, oldPrice: i.product?.oldPrice||0,
        image: i.product?.images?.[0]||i.product?.image||'', qty: i.quantity
      }));
      localStorage.setItem('cart', JSON.stringify(items));
    } else {
      localStorage.setItem('cart', '[]');
    }
    if (wishRes?.data) {
      // Map MongoDB ObjectIds → frontend numeric IDs
      const DB_IDS = [
        '69f4273291de8325503cbd27','69f4273291de8325503cbd2b','69f4273291de8325503cbd2f',
        '69f4273291de8325503cbd33','69f4273291de8325503cbd36','69f4273291de8325503cbd3a',
        '69f4273291de8325503cbd3e','69f4273291de8325503cbd41','69f4273291de8325503cbd44',
        '69f4273291de8325503cbd47','69f4273291de8325503cbd4a','69f4273291de8325503cbd4d',
        '69f4273291de8325503cbd50','69f4273291de8325503cbd53','69f4273391de8325503cbd56',
        '69f4273391de8325503cbd59'
      ];
      const ids = wishRes.data.map(p => {
        const dbId = String(typeof p==='object' ? (p._id||p.id) : p);
        const idx  = DB_IDS.indexOf(dbId);
        return idx !== -1 ? String(idx+1) : null;
      }).filter(Boolean);
      localStorage.setItem('wishlist', JSON.stringify(ids));
      localStorage.setItem('nansei_wishlist', JSON.stringify(ids));
    } else {
      localStorage.setItem('wishlist', '[]');
    }
  }).catch(() => {
    localStorage.setItem('cart', '[]');
    localStorage.setItem('wishlist', '[]');
  }).finally(() => {
    window.location.href = d.user?.role === 'admin' ? 'admin-panel.html' : 'index.html';
  });
}

function googleSignIn() {
  if (!window.GOOGLE_CLIENT_ID || window.GOOGLE_CLIENT_ID.includes('your_google')) {
    toast('Google Sign-In is not configured yet.', 'err'); return;
  }
  if (!window.google) { toast('Google script not loaded. Check your connection.', 'err'); return; }
  google.accounts.id.initialize({
    client_id: window.GOOGLE_CLIENT_ID,
    ux_mode: 'popup',
    callback: async ({ credential }) => {
      try {
        const r = await apiFetch(API+'/auth/google', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({credential}) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.message || 'Google sign-in failed');
        save(d);
      } catch(err) { toast(err.message, 'err'); }
    }
  });
  google.accounts.id.prompt();
}

// Note: guest-guard and auth checks are now handled synchronously on script parse by auth.js.
