<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog & Stories | Nansai Organics</title>
  <meta name="description" content="Notes from the farm: heritage rice, dried flowers, cooking and traditional food from Tamil Nadu." />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS — Nansai Brand
═══════════════════════════════════════ */
:root {
  --forest:      #1a3a2a;
  --forest-deep: #0f2218;
  --forest-mid:  #2d5a3d;
  --forest-leaf: #4a8c5c;
  --forest-sage: #8fbc9a;
  --cream:       #f7f3ec;
  --warm-white:  #fdfaf5;
  --gold:        #c9a84c;
  --gold-lt:     #e8c97a;
  --gold-dk:     #b8922a;
  --text-dk:     #1a2416;
  --text-md:     #3d5a45;
  --text-lt:     #7a9980;
  --nav-h:       68px;
  --radius:      18px;
  --shadow-sm:   0 2px 12px rgba(15,34,24,.07);
  --shadow-md:   0 8px 32px rgba(15,34,24,.13);
  --shadow-lg:   0 24px 60px rgba(15,34,24,.18);
}

/* ═══════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;
  background:var(--cream);
  color:var(--text-dk);
  overflow-x:hidden;
}
img{display:block;max-width:100%;}
a{text-decoration:none;color:inherit;}
button,input{font-family:inherit;border:none;outline:none;cursor:pointer;}

/* ═══════════════════════════════════════
   NAVBAR
═══════════════════════════════════════ */
.site-nav{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid rgba(26,58,42,.12);height:var(--nav-h);}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;height:100%;padding:0 1.75rem;gap:1.25rem;}
.nav-logo{flex-shrink:0;text-decoration:none;display:flex;align-items:center;}
.nav-logo img{height:64px;width:auto;object-fit:contain;}
.nav-links{display:flex;align-items:center;list-style:none;gap:0;flex-shrink:0;}
@media(max-width:768px){
  .site-nav .nav-inner{justify-content:center;padding:0 1rem;}
  .site-nav .nav-links,.site-nav .nav-actions{display:none!important;}
  .site-nav .nav-logo{margin:0 auto;}
  .mob-ham{display:none!important;}
}
.nav-links>li{display:flex;align-items:center;}
.nav-link,.nav-trigger{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;font-size:.79rem;font-weight:600;letter-spacing:.02em;color:var(--forest-deep);text-decoration:none;cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;white-space:nowrap;transition:color .2s;position:relative;border-radius:6px;}
.nav-link:hover,.nav-trigger:hover{color:var(--forest-leaf);background:rgba(74,140,92,.06);}
.nav-link.active{color:var(--forest-leaf);}
.nav-link::after,.nav-trigger::after{content:'';position:absolute;bottom:2px;left:14px;right:14px;height:2px;background:var(--gold-dk);transform:scaleX(0);transition:transform .24s ease;pointer-events:none;}
.nav-link:hover::after,.nav-trigger:hover::after,.nav-link.active::after{transform:scaleX(1);}
.nav-actions{display:flex;align-items:center;gap:.7rem;margin-left:auto;flex-shrink:0;}
.nav-divider{width:1px;height:18px;background:rgba(26,58,42,.15);flex-shrink:0;}
.nav-orders-btn{display:flex;align-items:center;gap:.35rem;font-size:.65rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--forest-deep);text-decoration:none;padding:.38rem .7rem;border:1px solid rgba(26,58,42,.2);border-radius:6px;transition:all .2s;white-space:nowrap;}
.nav-orders-btn svg{width:14px;height:14px;}
.nav-orders-btn:hover{color:var(--forest-leaf);border-color:var(--forest-leaf);background:rgba(74,140,92,.05);}
.nav-icon-btn{position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;background:none;color:var(--forest-deep);text-decoration:none;transition:color .2s,background .2s;}
.nav-icon-btn svg{width:19px;height:19px;}
.nav-icon-btn:hover{color:var(--forest-leaf);background:rgba(74,140,92,.08);}
.nav-badge{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font-size:.56rem;font-weight:800;min-width:15px;height:15px;padding:0 3px;border-radius:30px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;line-height:1;}
.mob-ham{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:3px;flex-shrink:0;}
.mob-ham span{display:block;width:22px;height:2px;background:var(--forest-deep);border-radius:2px;transition:all .3s;}
.mob-ham.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.mob-ham.open span:nth-child(2){opacity:0;}
.mob-ham.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
@media(max-width:768px){:root{--nav-h:58px;}.nav-links,.nav-orders-btn,.nav-divider{display:none!important;}.mob-ham{display:flex;}}

/* ═══════════════════════════════════════
   HERO 3D CAROUSEL
═══════════════════════════════════════ */
.blog-hero{
  position:relative;
  background:#0a100b;
  overflow:hidden;
}
.slider-shell{
  position:relative;width:100%;
  overflow:hidden;
  perspective:1200px;
  perspective-origin:50% 50%;
  height:clamp(320px,42vw,540px);
}
.slide{
  position:absolute;top:0;left:0;width:100%;height:100%;
  overflow:hidden;transform-origin:center center;
  transition:transform .85s cubic-bezier(.77,0,.18,1),opacity .85s cubic-bezier(.77,0,.18,1);
  opacity:0;pointer-events:none;
  backface-visibility:hidden;
}
.slide.active {opacity:1;pointer-events:all;transform:translateX(0) rotateY(0deg) scale(1);z-index:3;}
.slide.prev   {opacity:.4;transform:translateX(-72%) rotateY(38deg) scale(.82);z-index:2;}
.slide.next   {opacity:.4;transform:translateX(72%) rotateY(-38deg) scale(.82);z-index:2;}
.slide.far-prev{opacity:.12;transform:translateX(-110%) rotateY(55deg) scale(.68);z-index:1;}
.slide.far-next{opacity:.12;transform:translateX(110%) rotateY(-55deg) scale(.68);z-index:1;}
.slide-bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;
  transition:transform 7s ease;
}
.slide.active .slide-bg{transform:scale(1.04);}
.slide-overlay{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(110deg,rgba(5,12,6,.82) 0%,rgba(5,12,6,.35) 50%,transparent 72%),
             linear-gradient(to top,rgba(5,12,6,.55) 0%,transparent 55%);
}
.slide-accent{
  position:absolute;left:clamp(1rem,3.5vw,2.2rem);top:0;bottom:0;width:2px;z-index:2;
  background:linear-gradient(to bottom,transparent 0%,#c9a84c 30%,#c9a84c 70%,transparent 100%);
  opacity:0;transition:opacity .5s .4s;
}
.slide.active .slide-accent{opacity:1;}
.slide-content{
  position:absolute;inset:0;z-index:3;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(1.2rem,4vw,2.8rem);
  padding-left:calc(clamp(1.2rem,4vw,2.8rem) + 16px);
  max-width:560px;
}
.slide-eyebrow{
  display:flex;align-items:center;gap:.45rem;
  font-size:.58rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:#e8c97a;margin-bottom:.5rem;
  opacity:0;transform:translateY(12px);
  transition:opacity .5s .55s,transform .5s .55s;
}
.slide-eyebrow span{display:block;width:1.4rem;height:1.5px;background:#c9a84c;flex-shrink:0;}
.slide.active .slide-eyebrow{opacity:1;transform:none;}
.slide-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;line-height:1.1;color:#fff;
  font-size:clamp(1.3rem,2.8vw,2.2rem);
  margin-bottom:.6rem;
  opacity:0;transform:translateY(16px);
  transition:opacity .55s .68s,transform .55s .68s;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.slide.active .slide-title{opacity:1;transform:none;}
.slide-title em{font-style:italic;color:#86c98a;}
.slide-desc{
  font-size:clamp(.65rem,.85vw,.8rem);font-weight:300;
  line-height:1.65;color:rgba(255,255,255,.58);
  max-width:340px;margin-bottom:1.1rem;
  opacity:0;transform:translateY(12px);
  transition:opacity .5s .8s,transform .5s .8s;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.slide.active .slide-desc{opacity:1;transform:none;}
.slide-meta{
  display:flex;align-items:center;gap:.55rem;
  font-size:.62rem;color:rgba(255,255,255,.45);
  margin-bottom:.9rem;
  opacity:0;transform:translateY(10px);
  transition:opacity .5s .88s,transform .5s .88s;
}
.slide.active .slide-meta{opacity:1;transform:none;}
.slide-meta-dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.3);}
.slide-cta{
  display:inline-flex;align-items:center;gap:.45rem;
  font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:.48rem 1.25rem;
  border:1px solid #c9a84c;color:#e8c97a;
  background:transparent;cursor:pointer;
  width:fit-content;position:relative;overflow:hidden;
  opacity:0;transform:translateY(10px);
  transition:opacity .5s .95s,transform .5s .95s,background .25s,color .25s;
  text-decoration:none;
}
.slide.active .slide-cta{opacity:1;transform:none;}
.slide-cta::before{
  content:'';position:absolute;inset:0;
  background:#c9a84c;transform:translateX(-101%);
  transition:transform .3s ease;z-index:-1;
}
.slide-cta:hover::before{transform:translateX(0);}
.slide-cta:hover{color:#0a100b;}
.slide-cat-badge{
  position:absolute;top:16px;right:16px;z-index:4;
  font-size:.54rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 12px;border-radius:20px;color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.ghost-num{
  position:absolute;right:1rem;bottom:.6rem;z-index:4;
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:clamp(2.5rem,6vw,4.5rem);
  color:rgba(255,255,255,.05);pointer-events:none;user-select:none;line-height:1;
}
.arrow-btn{
  position:absolute;top:50%;transform:translateY(-50%);z-index:20;
  width:2.2rem;height:2.2rem;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(5,12,6,.45);backdrop-filter:blur(6px);
  color:#fff;font-size:.8rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .25s,border-color .25s;
}
.arrow-btn:hover{background:#c9a84c;border-color:#c9a84c;color:#0a100b;}
.slider-footer{
  position:absolute;bottom:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;gap:.65rem;
  padding:.7rem clamp(1.2rem,4vw,2.8rem);
  background:linear-gradient(to top,rgba(5,12,6,.55) 0%,transparent 100%);
}
.sdot{
  width:.42rem;height:.42rem;border-radius:50%;
  background:rgba(255,255,255,.28);border:none;cursor:pointer;padding:0;
  transition:background .3s,transform .3s;
}
.sdot.active{background:#c9a84c;transform:scale(1.35);}
.timer-track{flex:1;height:1.5px;overflow:hidden;background:rgba(255,255,255,.12);}
.timer-fill{height:100%;width:0%;background:#c9a84c;}
@keyframes leafFloat1{
  0%,100%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-18px) rotate(8deg);}
}
@keyframes leafFloat2{
  0%,100%{transform:translateY(0) rotate(-6deg);}
  50%{transform:translateY(-22px) rotate(10deg);}
}
.hero-leaf{position:absolute;pointer-events:none;user-select:none;z-index:4;}
@media(max-width:768px){
  .slider-shell{height:clamp(260px,62vw,380px);}
  .slide-content{padding:1rem 1rem 1rem 1.4rem;justify-content:flex-end;padding-bottom:3.5rem;}
  .slide-title{font-size:clamp(1.1rem,5vw,1.5rem);}
  .slide-desc{font-size:.72rem;max-width:100%;}
  .ghost-num{display:none;}
  .hero-leaf{display:none;}
  .arrow-btn{width:1.8rem;height:1.8rem;font-size:.7rem;}
}

/* ═══════════════════════════════════════
   FILTER BAR
═══════════════════════════════════════ */
.filter-section{
  background:#fff;
  border-bottom:1px solid rgba(26,58,42,.1);
  position:sticky;top:var(--nav-h);z-index:900;
}
.filter-inner{
  max-width:1400px;margin:0 auto;
  padding:.85rem 1.75rem;
  display:flex;align-items:center;gap:.5rem;
  overflow-x:auto;scrollbar-width:none;
}
.filter-inner::-webkit-scrollbar{display:none;}
.fpill{
  flex-shrink:0;padding:.42rem 1.1rem;
  border-radius:30px;border:1.5px solid rgba(26,58,42,.15);
  background:#fff;color:var(--text-md);
  font-size:.76rem;font-weight:600;
  white-space:nowrap;
  cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.fpill:hover{border-color:var(--forest-leaf);color:var(--forest-leaf);transform:translateY(-1px);}
.fpill.active{
  background:var(--forest-deep);color:#fff;
  border-color:var(--forest-deep);
  box-shadow:0 4px 14px rgba(15,34,24,.22);
  transform:translateY(-1px);
}
.result-count{
  margin-left:auto;flex-shrink:0;
  font-size:.72rem;font-weight:600;color:var(--text-lt);
  white-space:nowrap;
}

/* ═══════════════════════════════════════
   3D ARTICLE CAROUSEL
═══════════════════════════════════════ */
.article-carousel-section{
  background:linear-gradient(160deg,var(--forest-deep) 0%,var(--forest-mid) 100%);
  padding:2.5rem 0 2.2rem;
  overflow:hidden;
  position:relative;
}
.article-carousel-section::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.12) 0%,transparent 65%);
  pointer-events:none;
}
.carousel-heading{
  text-align:center;margin-bottom:2.2rem;position:relative;z-index:1;
}
.carousel-heading h2{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.6rem,3vw,2.4rem);
  font-weight:700;color:#fff;
  letter-spacing:.02em;
}
.carousel-heading h2 em{font-style:italic;color:#86c98a;}
.carousel-heading p{
  font-size:.78rem;color:rgba(255,255,255,.45);
  margin-top:.35rem;
}
.carousel-stage{
  position:relative;
  height:clamp(260px,55vw,420px);
  perspective:1100px;
  perspective-origin:50% 50%;
}
.ac-card{
  position:absolute;
  top:50%;left:50%;
  width:clamp(160px,38vw,300px);
  transform-origin:center center;
  transform:translate(-50%,-50%);
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
  transition:transform .38s cubic-bezier(.77,0,.18,1),
             opacity .38s cubic-bezier(.77,0,.18,1),
             box-shadow .2s;
  will-change:transform,opacity;
  user-select:none;
}
.ac-card.pos-center{
  opacity:1;z-index:5;
  transform:translate(-50%,-50%) translateZ(0) rotateY(0deg) scale(1);
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.ac-card.pos-prev1{
  opacity:.75;z-index:4;
  transform:translate(calc(-50% - clamp(120px,22vw,260px)),-50%) rotateY(32deg) scale(.88);
}
.ac-card.pos-next1{
  opacity:.75;z-index:4;
  transform:translate(calc(-50% + clamp(120px,22vw,260px)),-50%) rotateY(-32deg) scale(.88);
}
.ac-card.pos-prev2{
  opacity:.28;z-index:3;
  transform:translate(calc(-50% - clamp(220px,38vw,440px)),-50%) rotateY(50deg) scale(.72);
}
.ac-card.pos-next2{
  opacity:.28;z-index:3;
  transform:translate(calc(-50% + clamp(220px,38vw,440px)),-50%) rotateY(-50deg) scale(.72);
}
.ac-card.pos-hidden{
  opacity:0;z-index:1;
  pointer-events:none;
  transform:translate(-50%,-50%) rotateY(90deg) scale(.5);
}
.ac-card:hover.pos-center{
  box-shadow:0 32px 80px rgba(0,0,0,.6);
  transform:translate(-50%,-50%) translateZ(0) rotateY(0deg) scale(1.03);
}
.ac-img{
  width:100%;height:clamp(110px,18vw,180px);
  object-fit:cover;display:block;
  transition:transform .5s cubic-bezier(.22,1,.36,1);
}
.ac-card.pos-center:hover .ac-img{transform:scale(1.06);}
.ac-body{
  padding:.9rem 1rem 1rem;
}
.ac-cat{
  display:inline-block;
  font-size:.5rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;
  color:#fff;margin-bottom:.5rem;
}
.ac-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(.78rem,2.2vw,1rem);
  font-weight:700;color:var(--forest-deep);
  line-height:1.3;margin-bottom:.4rem;
  display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden;
}
.ac-meta{
  font-size:.58rem;color:var(--text-lt);
  display:flex;align-items:center;gap:.35rem;
}
.ac-meta-dot{width:2px;height:2px;border-radius:50%;background:var(--text-lt);flex-shrink:0;}
.ac-read-btn{
  display:inline-flex;align-items:center;gap:3px;
  font-size:.6rem;font-weight:700;
  color:var(--forest-leaf);margin-top:.55rem;
  transition:gap .2s,color .2s;
}
.ac-read-btn:hover{color:var(--forest);gap:6px;}
.ac-read-btn svg{width:9px;height:9px;}
.carousel-controls{
  display:flex;align-items:center;justify-content:center;
  gap:1rem;margin-top:1.8rem;position:relative;z-index:10;
}
.ac-arrow{
  width:2.2rem;height:2.2rem;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);backdrop-filter:blur(6px);
  color:#fff;cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s,transform .15s;
  flex-shrink:0;
}
.ac-arrow:hover{background:var(--gold-dk);border-color:var(--gold-dk);transform:scale(1.1);}
.ac-arrow svg{width:14px;height:14px;}
.ac-dots{display:flex;align-items:center;gap:.45rem;}
.ac-dot{
  width:.38rem;height:.38rem;border-radius:50%;
  background:rgba(255,255,255,.25);border:none;cursor:pointer;padding:0;
  transition:background .3s,transform .3s;
}
.ac-dot.active{background:var(--gold);transform:scale(1.4);}
@media(max-width:768px){
  .article-carousel-section{padding:2rem 0 1.8rem;}
  .carousel-heading{margin-bottom:1.4rem;}
  .carousel-stage{height:clamp(280px,90vw,360px);}
  .ac-card{width:58vw;max-width:240px;border-radius:12px;}
  .ac-card.pos-prev2,.ac-card.pos-next2{opacity:0;pointer-events:none;}
  .ac-card.pos-prev1{transform:translate(calc(-50% - 52vw),-50%) rotateY(22deg) scale(.84);opacity:.6;}
  .ac-card.pos-next1{transform:translate(calc(-50% + 52vw),-50%) rotateY(-22deg) scale(.84);opacity:.6;}
  .ac-img{height:140px;}
  .ac-body{padding:.7rem .8rem .8rem;}
  .ac-title{font-size:.82rem;-webkit-line-clamp:2;}
  .ac-meta{font-size:.55rem;}
  .ac-read-btn{font-size:.58rem;margin-top:.4rem;}
  .carousel-controls{margin-top:1.2rem;gap:.7rem;}
  .ac-arrow{width:2rem;height:2rem;}
  .ac-arrow svg{width:12px;height:12px;}
}
@media(max-width:400px){
  .ac-card{width:72vw;max-width:220px;}
  .ac-card.pos-prev1{transform:translate(calc(-50% - 62vw),-50%) rotateY(18deg) scale(.82);opacity:.5;}
  .ac-card.pos-next1{transform:translate(calc(-50% + 62vw),-50%) rotateY(-18deg) scale(.82);opacity:.5;}
  .ac-img{height:120px;}
}

/* ═══════════════════════════════════════
   MAIN BLOG GRID
═══════════════════════════════════════ */
.blog-main{
  max-width:1400px;margin:0 auto;
  padding:3rem 1.75rem 5rem;
}
.meta-dot{
  width:3px;height:3px;border-radius:50%;
  background:rgba(26,58,42,.2);flex-shrink:0;
}

/* Blog grid */
.blog-grid-label{
  display:flex;align-items:center;gap:1rem;
  margin-bottom:1.75rem;
}
.blog-grid-label h3{
  font-family:'Cormorant Garamond',serif;
  font-size:1.5rem;font-weight:700;color:var(--forest-deep);
}
.blog-grid-label::after{
  content:'';flex:1;height:1px;
  background:rgba(26,58,42,.1);
}
.blog-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:1.5rem;
}

<script src="https://unpkg.com/lucide@1.72.0/dist/umd/lucide.min.js"></script>
<script>
(function(){
  const markerRe = /\[\[icon:([a-z0-9-]+)\]\]/g;
  function applyIcons(root){
    root = root || document.body;
    if(!root) return;

    root.querySelectorAll?.('[placeholder],[title],[aria-label],[alt]').forEach(el => {
      ['placeholder','title','aria-label','alt'].forEach(attr => {
        const value = el.getAttribute(attr);
        if(value && markerRe.test(value)){
          el.setAttribute(attr, value.replace(markerRe, '').replace(/\s{2,}/g, ' ').trim());
          markerRe.lastIndex = 0;
        }
      });
    });

    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        if(!markerRe.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
        markerRe.lastIndex = 0;
        const tag = node.parentElement?.tagName;
        if(['SCRIPT','STYLE','TEXTAREA','OPTION'].includes(tag)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    while(walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(node => {
      const frag = document.createDocumentFragment();
      let last = 0;
      node.nodeValue.replace(markerRe, (match, name, offset) => {
        if(offset > last) frag.append(document.createTextNode(node.nodeValue.slice(last, offset)));
        const icon = document.createElement('i');
        icon.setAttribute('data-lucide', name);
        icon.setAttribute('aria-hidden', 'true');
        icon.className = 'nansai-icon';
        frag.append(icon);
        last = offset + match.length;
      });
      if(last < node.nodeValue.length) frag.append(document.createTextNode(node.nodeValue.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });

    root.querySelectorAll?.('option').forEach(option => {
      if(markerRe.test(option.textContent)){
        option.textContent = option.textContent.replace(markerRe, '').replace(/\s{2,}/g, ' ').trim();
        markerRe.lastIndex = 0;
      }
    });

    if(window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 2.25 } });
  }

  window.nansaiApplyIcons = applyIcons;
  document.addEventListener('DOMContentLoaded', () => {
    applyIcons(document.body);
  });
})();
</script>

  document.querySelector('.fpill[data-cat="all"]').classList.add('active');
  renderAll();
}

function getFiltered() {
  let list = [...BLOGS];
  if (currentFilter !== 'all') {
    list = list.filter(b => b.category === currentFilter || b.tags.includes(currentFilter));
  }
  if (searchQuery) {
    list = list.filter(b =>
      b.title.toLowerCase().includes(searchQuery) ||
      b.excerpt.toLowerCase().includes(searchQuery) ||
      (b.product || '').toLowerCase().includes(searchQuery) ||
      b.category.toLowerCase().includes(searchQuery) ||
      b.tags.some(t => t.includes(searchQuery))
    );
  }
  return list;
}

/* ── Render Grid ── */
function renderGrid(posts) {
  const grid = document.getElementById('blogGrid');
  const label = document.getElementById('gridLabel');
  const count = document.getElementById('resultCount');
  const gridPosts = posts;

  // update count
  count.textContent = posts.length + ' article' + (posts.length !== 1 ? 's' : '');

  // update label
  const catMeta = CAT_META[currentFilter];
  const labelTxt = currentFilter === 'all' ? 'All Articles' : ((catMeta?.icon||'') + ' ' + (catMeta?.label||currentFilter));
  label.querySelector('h3').textContent = labelTxt;

  if (!gridPosts.length) {
    grid.innerHTML = `<div class="no-results">
      <p>No articles found${searchQuery ? ' for "'+searchQuery+'"' : ''}.</p>
    </div>`;
    return;
  }

  grid.innerHTML = gridPosts.map(post => {
    const cat = CAT_META[post.category] || {};
    const tagPills = post.tags.map(t => {
      const tm = CAT_META[t]||{};
      return `<span class="blog-tag-pill" style="color:${tm.color||'#4a8c5c'};border-color:${tm.color||'#4a8c5c'}22;background:${tm.bg||'#f0fdf4'}">${t}</span>`;
    }).join('');
    return `<article class="blog-card" onclick="openModal('${post.id}')">
      <div class="blog-card-img">
        <img src="${post.image}" alt="${post.title}" loading="lazy"/>
        <span class="blog-cat-tag" style="background:${cat.color||'#4a8c5c'}">${cat.icon||''} ${cat.label||post.category}</span>
      </div>
      <div class="blog-card-body">
        <div class="blog-card-tags">${tagPills}</div>
        <h3>${post.title}</h3>
        <p>${post.excerpt}</p>
        ${post.product ? `<p style="font-size:.72rem;font-weight:700;color:var(--forest-leaf);margin-bottom:.5rem;margin-top:-.3rem;">${post.product}</p>` : ''}
        <div class="blog-card-meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>${post.author}</span>
          <span class="meta-dot"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>${post.read} read</span>
          <a class="card-read-link" onclick="event.stopPropagation();openModal('${post.id}')">
            Read
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
      </div>
    </article>`;
  }).join('');

  // stagger reveal
  requestAnimationFrame(() => {
    grid.querySelectorAll('.blog-card').forEach((card, i) => {
      card.style.transitionDelay = (i * 0.06) + 's';
      requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));
    });
  });
}

/* ── 3D Article Carousel ── */
let acIndex = 0, acTimer = null;

function buildCarousel() {
  const posts = BLOGS.slice(0, 8);
  const stage = document.getElementById('acStage');
  const dots  = document.getElementById('acDots');
  const total = posts.length;

  stage.innerHTML = posts.map((post, i) => {
    const cat = CAT_META[post.category] || {};
    return `<div class="ac-card" data-i="${i}" onclick="openModal('${post.id}')">
      <img class="ac-img" src="${post.image}" alt="${post.title}" loading="lazy"/>
      <div class="ac-body">
        <span class="ac-cat" style="background:${cat.color||'#4a8c5c'}">${cat.icon||''} ${cat.label||post.category}</span>
        <div class="ac-title">${post.title}</div>
        <div class="ac-meta"><span>${post.author}</span><span class="ac-meta-dot"></span><span>${post.read} read</span></div>
        <span class="ac-read-btn">Read Article <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
      </div>
    </div>`;
  }).join('');

  dots.innerHTML = posts.map((_, i) =>
    `<button class="ac-dot${i===0?' active':''}" onclick="acGoTo(${i})"></button>`
  ).join('');

  document.getElementById('acPrev').onclick = () => acGoTo((acIndex - 1 + total) % total);
  document.getElementById('acNext').onclick = () => acGoTo((acIndex + 1) % total);

  let tx = 0;
  stage.addEventListener('pointerdown', e => { tx = e.clientX; });
  stage.addEventListener('pointerup', e => {
    const dx = e.clientX - tx;
    if (Math.abs(dx) > 40) acGoTo(dx < 0 ? (acIndex+1)%total : (acIndex-1+total)%total);
  });

  acGoTo(0, true);
  /* no automatic sliding: shoppers move it with the arrows */
}

function acGoTo(idx, instant) {
  const cards = document.querySelectorAll('.ac-card');
  const total = cards.length;
  acIndex = idx;
  const pos = ['pos-prev2','pos-prev1','pos-center','pos-next1','pos-next2'];
  cards.forEach(c => { c.className = 'ac-card pos-hidden'; });
  [-2,-1,0,1,2].forEach((off, pi) => {
    cards[(idx + off + total) % total].className = 'ac-card ' + pos[pi];
  });
  document.querySelectorAll('.ac-dot').forEach((d, i) => d.classList.toggle('active', i === idx));

}

/* ── Main render ── */
function renderAll() {
  renderGrid(getFiltered());
}

/* ── Modal ── */
function openModal(id, fromHistory) {
  const post = BLOGS.find(b => String(b.id) === String(id));
  if (!post) return;
  if (!fromHistory) history.pushState({ post: String(post.id) }, '', '?post=' + encodeURIComponent(post.id));
  document.title = post.title + ' | Nansai Organics';
  const cat = CAT_META[post.category] || {};

  document.getElementById('modalImg').src = post.image;
  document.getElementById('modalImg').alt = post.title;
  document.getElementById('modalCat').textContent = (cat.icon||'') + ' ' + (cat.label||post.category);
  document.getElementById('modalCat').style.background = cat.color || '#4a8c5c';
  document.getElementById('modalTitle').textContent = post.title;
  document.getElementById('modalMeta').innerHTML = `
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>${post.author}</span>
    <span style="width:3px;height:3px;border-radius:50%;background:rgba(26,58,42,.2);"></span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>${post.date}</span>
    <span style="width:3px;height:3px;border-radius:50%;background:rgba(26,58,42,.2);"></span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>${post.read} read</span>`;
  document.getElementById('modalContent').innerHTML = post.content;

  // CTA
  const ctaEl = document.getElementById('modalCTA');
  if (post.productId) {
    ctaEl.innerHTML = `
      <p>Made with <strong>${post.product}</strong> from our farm.</p>
      <a class="cta-btn" href="product.html?id=${post.productId}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 002 1.58h9.78a2 2 0 001.95-1.57l1.65-7.43H5.12"/></svg>
        Shop ${post.product}
      </a>`;
    ctaEl.style.display = 'flex';
  } else {
    ctaEl.style.display = 'none';
  }

  const modal = document.getElementById('articleModal');
  modal.style.display = 'flex';
  requestAnimationFrame(() => modal.classList.add('open'));
  document.body.style.overflow = 'hidden';
  document.getElementById('modalBox').scrollTop = 0;
}

function closeModal(fromHistory) {
  if (!fromHistory && new URLSearchParams(location.search).get('post')) { history.back(); return; }
  document.title = 'Blog & Stories | Nansai Organics';
  const modal = document.getElementById('articleModal');
  modal.classList.remove('open');
  setTimeout(() => { modal.style.display = 'none'; document.body.style.overflow = ''; }, 320);
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* ── Newsletter ── */
function subscribeNewsletter() {
  const email = document.getElementById('nlEmail').value.trim();
  if (!email || !email.includes('@')) { showToast('Please enter a valid email address.'); return; }
  showToast('[[icon:leaf]] Subscribed! Welcome to the Nansai farm family.');
  document.getElementById('nlEmail').value = '';
}

/* ── Toast ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ── Mobile Drawer ── */
function toggleMobDrawer() {
  const d = document.getElementById('mobDrawer');
  const h = document.getElementById('mobHam');
  const open = d.style.display === 'none' || !d.style.display;
  d.style.display = open ? 'block' : 'none';
  document.body.style.overflow = open ? 'hidden' : '';
}
document.addEventListener('click', e => {
  const d = document.getElementById('mobDrawer');
  const h = document.getElementById('mobHam');
  if (d?.style.display === 'block' && !d.contains(e.target) && !h?.contains(e.target)) {
    d.style.display = 'none';
    document.body.style.overflow = '';
  }
});

/* ── Scroll reveal ── */
const srObserver = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('is-visible'); });
}, { threshold: 0.08 });
document.querySelectorAll('.sr').forEach(el => srObserver.observe(el));

/* ── Auth nav ── */
(function() {
  const user = JSON.parse(localStorage.getItem('nansai_user') || 'null');
  if (!user) return;
  const btn = document.getElementById('navSignInBtn');
  const txt = document.getElementById('navSignInText');
  if (btn) btn.href = 'account.html';
  if (txt) txt.textContent = 'Hi, ' + (user.name || 'User').split(' ')[0];
})();

/* ── Cart / wishlist counters ── */
(function() {
  const cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const wish = JSON.parse(localStorage.getItem('wishlist') || '[]');
  const ct = cart.reduce((s, i) => s + (i.qty || 1), 0);
  document.querySelectorAll('#cartCount').forEach(el => el.textContent = ct);
  document.querySelectorAll('#wishlistCount').forEach(el => el.textContent = wish.length);
})();

/* ── Init ── */
buildCarousel();
renderAll();
</script>
<script>
/* article links: open the article named in ?post=, and let Back close it */
window.addEventListener('popstate', () => {
  const id = new URLSearchParams(location.search).get('post');
  if (id) openModal(id, true); else closeModal(true);
});
/* posts written in the admin panel (GET /api/blogs) appear above the ones written into this page */
(async function () {
  const local = ['localhost', '127.0.0.1'].includes(location.hostname) || location.protocol === 'file:';
  const base = local ? 'http://localhost:5000/api' : '/api';
  try {
    const res = await fetch(base + '/blogs');
    const d = await res.json();
    (d.data || []).forEach(b => {
      if (BLOGS.some(x => String(x.id) === String(b._id))) return;
      BLOGS.unshift({
        id: String(b._id), productId: null, category: b.category || 'recipes', tags: [], product: null,
        title: b.title, excerpt: b.excerpt || '', author: b.author || 'Nansai Farm Team',
        date: new Date(b.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }),
        read: b.readTime || '4 min', image: b.image || '', content: b.content || ''
      });
    });
    if ((d.data || []).length) renderAll();
  } catch (e) { /* keep the articles on this page */ }
  const open = new URLSearchParams(location.search).get('post');
  if (open) openModal(open, true);
})();
</script>
