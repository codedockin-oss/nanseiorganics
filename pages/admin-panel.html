<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Store admin — Nansei Organics</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="nansei_org_logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css?v=20261118g"/>
<script src="js/config.js?v=20261116"></script>
</head>
<body>
<div id="gate"><div><div class="spin"></div>Checking your admin access…</div></div>

<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Admin menu">
    <div class="side-brand"><img src="nansei_org_logo.svg" alt="Nansei Organics"/><span>Admin</span><button class="side-fold" id="fold" type="button" aria-label="Collapse the menu" title="Collapse the menu"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 10l-2 2 2 2"/></svg></button></div>
    <nav class="side-nav" id="nav">
      <a href="#/" data-r="dashboard" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <div class="side-group">Sell</div>
      <a href="#/orders" data-r="orders" title="Orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg><span>Orders</span><span class="count" id="cOrders" hidden></span></a>
      <a href="#/products" data-r="products" title="Products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg><span>Products</span></a>
      <a href="#/inventory" data-r="inventory" title="Stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2"/></svg><span>Stock</span><span class="count warn" id="cLow" hidden></span></a>
      <a href="#/customers" data-r="customers" title="Customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>Customers</span></a>
      <a href="#/coupons" data-r="coupons" title="Coupons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></svg><span>Coupons</span></a>
      <a href="#/reviews" data-r="reviews" title="Reviews"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg><span>Reviews</span><span class="count" id="cReviews" hidden></span></a>
      <div class="side-group">Content</div>
      <a href="#/homepage" data-r="homepage" title="Home page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/></svg><span>Home page</span></a>
      <a href="#/blogs" data-r="blogs" title="Blogs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>Blogs</span><span class="count soft" id="cBlogs" hidden></span></a>
      <a href="#/news" data-r="news" title="News"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0V11h4"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg><span>News</span><span class="count soft" id="cNews" hidden></span></a>
      <div class="side-group">Store</div>
      <a href="#/settings" data-r="settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></a>
    </nav>
    <div class="side-foot"><a class="side-shop" href="index.html" target="_blank" rel="noopener" title="View the shop"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg><span>View the shop</span></a></div>
  </aside>

  <main>
    <header class="top">
      <button class="ham" id="ham" type="button" aria-label="Open menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <button class="search-btn" id="searchBtn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Search products, orders, customers</span><kbd>Ctrl K</kbd></button>
      <span class="sp"></span>
      <div class="me create">
        <button class="btn pri" id="newBtn" type="button" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="hide-sm">Create</span></button>
        <div class="menu" id="newMenu" hidden>
          <a href="#/products/new">Product</a>
          <a href="#/blogs/new">Blog article</a>
          <a href="#/news/new">News update</a>
          <a href="#/coupons?new=1">Coupon</a>
        </div>
      </div>
      <div class="me">
        <button class="me-btn" id="meBtn" type="button" aria-haspopup="true" aria-expanded="false"><span class="av" id="meAv">A</span><b id="meName">Admin</b></button>
        <div class="menu" id="meMenu" hidden>
          <div class="who"><b id="meName2">Admin</b><span id="meEmail"></span></div>
          <a href="index.html" target="_blank" rel="noopener">View the shop</a>
          <a href="#/settings">Store settings</a>
          <button type="button" onclick="A.shortcuts()">Keyboard shortcuts <kbd style="margin-left:auto">?</kbd></button>
          <label class="check" style="padding:8px 10px;font-weight:600;cursor:pointer"><input type="checkbox" id="soundOn"/> Sound for new orders</label>
          <button type="button" id="signOut">Sign out</button>
        </div>
      </div>
    </header>
    <div class="savebar" id="savebar" role="region" aria-label="Unsaved changes"><b>Unsaved changes</b><button class="btn ghost" id="sbDiscard" type="button">Discard</button><button class="btn gold" id="sbSave" type="button">Save</button></div>
    <div class="view" id="view" tabindex="-1"></div>
  </main>
</div>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle">
  <div class="dr-h"><h2 id="drTitle"></h2><button class="x" type="button" data-close aria-label="Close">&times;</button></div>
  <div class="dr-b" id="drBody"></div>
  <div class="dr-f" id="drFoot"></div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
  <div class="veil on" data-close style="position:absolute"></div>
  <div class="modal-c" id="mdBox">
    <div class="dr-h"><h2 id="mdTitle"></h2><button class="x" type="button" data-close aria-label="Close">&times;</button></div>
    <div class="dr-b" id="mdBody"></div>
    <div class="dr-f" id="mdFoot"></div>
  </div>
</div>
<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Search">
  <div class="veil on" data-close style="position:absolute"></div>
  <div class="pal-c">
    <div class="pal-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="palIn" placeholder="Search products, orders or pages" autocomplete="off" aria-label="Search"/><kbd>Esc</kbd></div>
    <div class="pal-list" id="palList" role="listbox"></div>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span>Type an order number to open it</span></div>
  </div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="js/admin-core.js?v=20261118c"></script>
<script src="js/admin-app.js?v=20261118d"></script>
</body>
</html>
