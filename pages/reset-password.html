<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — Nansai Organics</title>
<script src="../js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--white:#fff;--off-white:#f8f6f2;--stone:#e8e4dc;--stone-2:#d4cfc6;--text:#1a1a1a;--muted:#888880;--green:#1e3d2f;--error:#c0392b}
html,body{margin:0;padding:0;width:100%}
body{font-family:'Inter',sans-serif;background:var(--off-white);color:var(--text);-webkit-font-smoothing:antialiased;}
.page-center{width:100%;padding:40px 20px;}
.form-wrap{width:100%;max-width:380px;margin:0 auto;background:var(--white);padding:40px 36px;border:1px solid var(--stone);}
@media(min-width:481px){.page-center{min-height:100vh;display:flex;align-items:center;justify-content:center;}}
.logo{text-align:center;margin-bottom:32px}
.logo img{height:56px;width:auto;margin:0 auto;display:block}
.form-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;letter-spacing:-.01em;line-height:1.1;margin-bottom:6px}
.form-sub{font-size:.78rem;font-weight:300;color:var(--muted);letter-spacing:.02em;margin-bottom:32px}
.field{margin-bottom:20px}
.field label{display:block;font-size:.63rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.inp-wrap{position:relative}
input{width:100%;padding:13px 0;border:none;border-bottom:1px solid var(--stone-2);background:transparent;font-family:'Inter',sans-serif;font-size:16px;font-weight:300;color:var(--text);outline:none;transition:border-color .25s;-webkit-appearance:none;border-radius:0;}
input::placeholder{color:var(--stone-2)}
input:focus{border-color:var(--text)}
input.err{border-color:var(--error)}
.inp-line{position:absolute;bottom:0;left:0;height:1px;width:0;background:var(--text);transition:width .3s cubic-bezier(.4,0,.2,1)}
input:focus~.inp-line{width:100%}
.eye-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--stone-2);display:flex;align-items:center;padding:10px 4px;}
.eye-btn:hover{color:var(--text)}
.err-msg{font-size:.68rem;color:var(--error);margin-top:6px;display:none}
.err-msg.on{display:block}
.strength-row{display:flex;gap:4px;margin-top:10px;height:2px}
.strength-row span{flex:1;background:var(--stone);transition:background .3s;border-radius:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 16px;background:var(--black);color:var(--white);border:none;border-radius:0;font-family:'Inter',sans-serif;font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;margin-top:28px;-webkit-appearance:none;transition:background .2s;min-height:54px;}
.btn:hover{background:var(--green)}
.btn:active{opacity:.85}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;color:var(--muted);text-decoration:none;margin-top:20px;transition:color .2s;}
.back-link:hover{color:var(--text)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--black);color:var(--white);font-size:.72rem;padding:12px 24px;white-space:nowrap;opacity:0;pointer-events:none;z-index:9999;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--error)}
.invalid-box{text-align:center;padding:20px 0}
.invalid-box p{font-size:.85rem;color:var(--muted);margin-bottom:16px}
@media(max-width:480px){.page-center{padding:0;}.form-wrap{padding:36px 20px 72px;border:none;min-height:100vh;}}
</style>
</head>
<body>
<div class="page-center">
<div class="form-wrap">
  <div class="logo">
    <img src="nansei_org_logo.svg" alt="Nansai Organics" onerror="this.src='nansei organics.png'"/>
  </div>

  <div id="pg-form">
    <h2 class="form-title">New password</h2>
    <p class="form-sub">Choose a strong password for your account</p>
    <form onsubmit="doReset(event)" novalidate>
      <div class="field">
        <label>New Password</label>
        <div class="inp-wrap">
          <input id="r-pass" type="password" placeholder="Min. 8 characters" autocomplete="new-password" style="padding-right:36px" oninput="strength(this.value)"/>
          <div class="inp-line"></div>
          <button type="button" class="eye-btn" onclick="toggleEye('r-pass',this)">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-row"><span id="s1"></span><span id="s2"></span><span id="s3"></span></div>
        <p class="err-msg" id="r-pass-err"></p>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <div class="inp-wrap">
          <input id="r-confirm" type="password" placeholder="Repeat password" autocomplete="new-password" style="padding-right:36px"/>
          <div class="inp-line"></div>
          <button type="button" class="eye-btn" onclick="toggleEye('r-confirm',this)">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="err-msg" id="r-confirm-err"></p>
      </div>
      <button class="btn" id="btn-reset" type="submit">Set New Password</button>
    </form>
    <a href="login.html" class="back-link">
      <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to sign in
    </a>
  </div>

  <div id="pg-invalid" style="display:none">
    <div class="invalid-box">
      <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="#c0392b" stroke-width="1.5" style="margin:0 auto 16px;display:block"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01" stroke-linecap="round"/></svg>
      <p>This reset link is invalid or has expired.</p>
      <a href="login.html" class="btn" style="text-decoration:none;margin-top:0;">Back to Sign In</a>
    </div>
  </div>

  <div id="pg-success" style="display:none">
    <div class="invalid-box">
      <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="#1e3d2f" stroke-width="1.5" style="margin:0 auto 16px;display:block"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p>Password reset successfully!</p>
      <a href="login.html" class="btn" style="text-decoration:none;margin-top:0;">Sign In</a>
    </div>
  </div>

</div>
</div>
<div id="toast"></div>

<script>
const API = window.API_BASE || 'http://localhost:5000/api';
const token = new URLSearchParams(window.location.search).get('token');

if (!token) {
  document.getElementById('pg-form').style.display = 'none';
  document.getElementById('pg-invalid').style.display = 'block';
}

function toggleEye(id, btn) {
  const inp = document.getElementById(id);
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  btn.innerHTML = isPass
    ? `<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
    : `<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
}

function strength(v) {
  const s = !v ? 0 : v.length < 6 ? 1 : v.length < 10 ? 2 : 3;
  const c = ['','#c0392b','#b8922a','#1e3d2f'];
  [1,2,3].forEach(i => document.getElementById('s'+i).style.background = s >= i ? c[s] : 'var(--stone)');
}

function setErr(id, msg) {
  const el = document.getElementById(id); if (el) el.classList.add('err');
  const em = document.getElementById(id+'-err'); if (em) { em.textContent = msg; em.classList.add('on'); }
}

function clearErr() {
  document.querySelectorAll('input').forEach(i => i.classList.remove('err'));
  document.querySelectorAll('.err-msg').forEach(e => { e.classList.remove('on'); e.textContent = ''; });
}

let _tt;
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'on'+(type?' '+type:'');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('on'), 3000);
}

function setLoad(on) {
  const b = document.getElementById('btn-reset'); b.disabled = on;
  if (on) { b.dataset.h = b.innerHTML; b.innerHTML = `<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" stroke-opacity=".2"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`; }
  else b.innerHTML = b.dataset.h;
}

async function doReset(e) {
  e.preventDefault(); clearErr();
  const pass    = document.getElementById('r-pass').value;
  const confirm = document.getElementById('r-confirm').value;
  let ok = true;
  if (!pass || pass.length < 8) { setErr('r-pass', 'Minimum 8 characters'); ok = false; }
  if (!confirm)                  { setErr('r-confirm', 'Please confirm your password'); ok = false; }
  else if (pass !== confirm)     { setErr('r-confirm', 'Passwords do not match'); ok = false; }
  if (!ok) return;
  setLoad(true);
  try {
    const r = await fetch(`${API}/auth/reset-password/${token}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Reset failed');
    document.getElementById('pg-form').style.display = 'none';
    document.getElementById('pg-success').style.display = 'block';
  } catch(err) {
    if (err.message.toLowerCase().includes('invalid') || err.message.toLowerCase().includes('expired')) {
      document.getElementById('pg-form').style.display = 'none';
      document.getElementById('pg-invalid').style.display = 'block';
    } else {
      toast(err.message, 'err');
      setLoad(false);
    }
  }
}
</script>
</body>
</html>
