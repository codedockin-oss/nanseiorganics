<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password - Nansei Organics</title>
<script src="../js/config.js"></script>
<script src="../frontend/js/api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:18px;font-family:"DM Sans",sans-serif;background:linear-gradient(135deg,#fff,#eef8f1,#f7f3ec);color:#172116}
.card{width:min(430px,100%);background:rgba(255,255,255,.9);border:1px solid rgba(18,50,32,.12);border-radius:24px;box-shadow:0 24px 70px rgba(18,50,32,.14);padding:30px}
img{width:120px;display:block;margin:0 auto 22px}
h1{font-family:"Cormorant Garamond",serif;color:#123220;font-size:2.2rem;line-height:1;margin-bottom:8px}
p{color:#6d8371;font-size:.92rem;line-height:1.55;margin-bottom:20px}
label{display:block;font-size:.78rem;font-weight:800;color:#123220;margin:14px 0 7px}
input{width:100%;height:48px;border:1.5px solid rgba(18,50,32,.14);border-radius:14px;padding:0 14px;font:inherit;outline:none}
input:focus{border-color:#4a8c5c;box-shadow:0 0 0 4px rgba(74,140,92,.12)}
.err{display:none;color:#b83232;font-size:.74rem;font-weight:700;margin-top:6px}
.err.show{display:block}
button{width:100%;height:50px;border:0;border-radius:15px;background:linear-gradient(135deg,#123220,#2d5a3d);color:white;font-weight:900;margin-top:18px;cursor:pointer;box-shadow:0 14px 30px rgba(18,50,32,.22)}
button:disabled{opacity:.62;cursor:not-allowed}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;background:#123220;color:#fff;padding:10px 16px;border-radius:999px;font-size:.82rem;font-weight:800;transition:.22s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{background:#b83232}
</style>
</head>
<body>
<div id="toast"></div>
<form class="card" id="resetForm">
  <img src="nansei_org_logo.svg" alt="Nansei Organics"/>
  <h1>Reset Password</h1>
  <p>Create a new password for your Nansei Organics account.</p>
  <label for="password">New Password</label>
  <input id="password" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"/>
  <div class="err" id="passwordErr"></div>
  <label for="confirm">Confirm Password</label>
  <input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat password"/>
  <div class="err" id="confirmErr"></div>
  <button id="submitBtn" type="submit">Update Password</button>
</form>
<script>
const token = new URLSearchParams(location.search).get('token');
const toast = document.getElementById('toast');
function showToast(message, error){toast.textContent=message;toast.className='show'+(error?' error':'');setTimeout(()=>toast.className='',3000)}
function setErr(id,msg){const el=document.getElementById(id);el.textContent=msg;el.classList.toggle('show',!!msg)}
document.getElementById('resetForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  setErr('passwordErr','');setErr('confirmErr','');
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  if(!token){showToast('Reset token is missing',true);return}
  if(password.length<8){setErr('passwordErr','Password must be at least 8 characters');return}
  if(password!==confirm){setErr('confirmErr','Passwords do not match');return}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Updating...';
  try{
    const res=await fetch((window.API_BASE||'http://localhost:5000/api')+'/auth/reset-password/'+encodeURIComponent(token),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.message||'Could not reset password');
    Auth.persist(data.token,data.user);
    showToast('Password updated');
    setTimeout(()=>location.replace('account.html'),700);
  }catch(err){showToast(err.message,true)}
  finally{btn.disabled=false;btn.textContent='Update Password'}
});
</script>
</body>
</html>
