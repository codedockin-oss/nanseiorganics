# ── API proxy ─────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/*"
  to = "https://nansei-backend.onrender.com/api/:splat"
  status = 200
  force = true

# ── Anything else is a real 404 (the store has no client-side routing, so there is no reason to serve the home page for unknown URLs)
[[redirects]]
  from = "/*"
  to = "/pages/404.html"
  status = 404

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Explicit MIME types for JS — prevents text/html being served for JS files
# Site scripts/styles change between deploys, so browsers must re-check them (cheap 304s).
# Only the version-pinned vendor bundle is cached "forever".
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
