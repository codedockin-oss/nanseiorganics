[build]
  publish = "."

# ── Never publish server code, tests, source art or project notes (the site is published from the repo root) ──
[[redirects]]
  from = "/backend/*"
  to = "/pages/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/pages/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets-source/*"
  to = "/pages/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/pages/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOY.md"
  to = "/pages/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SECURITY.md"
  to = "/pages/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/render.yaml"
  to = "/pages/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/pages/404.html"
  status = 404
  force = true

# ── Static asset rules (must come BEFORE catch-all) ──────────────────────────
# Serve JS files directly — never redirect them to index.html
[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

